fluid_name: CO2
backend: REFPROP
roughness: 1.0e-6
inlet_opening: 10.0e-3
width: 15.0e-3
u_in: 15.0
isentropic: false  # also run/plot the closed-form isentropic cross-check
inlet_thermodynamics: PT_INPUTS

# Dimensional circular nozzle written to out/nozzle_geometry_<label>.csv
# (x, r, D, A in SI), read by get_nozzle_from_csv in nozzle-hyperbolic.
# The frictionless design fixes only the shape A/A*(x/L); length and size are
# free.  L/D_throat = 50 keeps the wall half-angles small (~3 deg convergent,
# ~1.5 deg divergent), comparable to the Super Moby Dick nozzle (D* = 20 mm).
geometry_export:
  length: 1.0              # axial length [m]
  throat_diameter: 20.0e-3 # [m]

cases:
#   - label: Case 1
#     p0_total: 2.5e+5
#     Q0: 0.0
#     p_out: 0.9e+5

  # - label: Case 2
  #   p0_total: 9.0e+6
  #   Q0: 303.0
  #   p_out: 8.0e+5

  # - label: Case 3
  #   p0_total: 120.0e+5
  #   Q0: 310.15
  #   p_out: 30.0e+5

  - label: Case 4
    p0_total: 120.0e+5
    Q0: 295.0
    p_out: 20.0e+5

